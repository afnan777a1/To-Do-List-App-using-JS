<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Document</title>
  </head>

    style="
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 200px;
    "
  >
    <div
      style="
        color: rgb(255, 0, 0);
        background: linear-gradient(to right, rgb(255, 179, 179), #5f0909);

    >

          id="myInput"

      <h3>Shopping To Do List</h3>
      <ul id="myItem"></ul>

    <script src="script.js"></script>
